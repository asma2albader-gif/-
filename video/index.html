<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لغز المختبر: الصفحات المفقودة</title>
<style>
@font-face{font-family:Cairo;font-weight:400;src:url(fonts/Cairo-400.ttf)}
@font-face{font-family:Cairo;font-weight:700;src:url(fonts/Cairo-700.ttf)}
@font-face{font-family:Cairo;font-weight:900;src:url(fonts/Cairo-900.ttf)}
@font-face{font-family:Tajawal;font-weight:500;src:url(fonts/Tajawal-500.ttf)}
@font-face{font-family:Tajawal;font-weight:800;src:url(fonts/Tajawal-800.ttf)}
:root{
  --ink:#0a2530; --ink2:#113845; --teal:#127369; --teal2:#1fa595; --mint:#bfe9df;
  --paper:#fbf6ea; --amber:#f4ab3c; --red:#e2584c; --green:#35b37a; --lav:#e9e6fb;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;height:100%;overflow:hidden}
body{font-family:Cairo,Tajawal,sans-serif;color:#fff}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;transform-origin:0 0;
  background:radial-gradient(ellipse at 50% 40%,#123f4a 0%,#0a2530 55%,#06171e 100%)}
.scene{position:absolute;inset:0;display:none}
.abs{position:absolute}
.pin{position:absolute;width:0;height:0;display:flex;align-items:center;justify-content:center}
.pin>*{flex:none}
svg .p, .person{transform-box:fill-box;transform-origin:50% 100%}
svg .c{transform-box:fill-box;transform-origin:50% 50%}
.center{position:absolute;left:0;right:0;text-align:center}
.h1{font-weight:900;font-size:150px;line-height:1.1}
.h2{font-weight:900;font-size:72px;line-height:1.2}
.h3{font-weight:700;font-size:44px;line-height:1.35}
.body{font-weight:400;font-size:34px;line-height:1.55}
.pill{display:inline-block;padding:10px 34px;border-radius:999px;background:rgba(31,165,149,.18);border:2px solid rgba(31,165,149,.6);font-weight:700;font-size:32px;color:var(--mint)}
.amber{color:var(--amber)} .mint{color:var(--mint)}
.card{background:#fff;color:var(--ink);border-radius:28px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.btn{display:inline-block;padding:18px 56px;border-radius:999px;background:var(--amber);color:var(--ink);font-weight:900;font-size:40px;box-shadow:0 10px 0 #b9761d,0 18px 40px rgba(0,0,0,.35)}
.chip{white-space:nowrap;padding:10px 26px;border-radius:16px;background:#fff;color:var(--ink);font-weight:700;font-size:30px;border-inline-start:10px solid var(--amber);box-shadow:0 10px 30px rgba(0,0,0,.3)}
.ring{width:150px;height:150px;border-radius:50%;border:6px solid var(--amber);box-shadow:0 0 0 8px rgba(244,171,60,.25)}
.cursor{position:absolute;left:0;top:0;width:60px;height:60px;z-index:50}
/* station */
.topbar{position:absolute;left:0;right:0;top:0;height:96px;background:linear-gradient(180deg,rgba(6,23,30,.92),rgba(6,23,30,.75));display:flex;align-items:center;justify-content:space-between;padding:0 50px;z-index:20}
.topbar .ttl{font-weight:900;font-size:38px}
.steps{display:flex;gap:16px}
.step{padding:8px 26px;border-radius:999px;font-weight:700;font-size:26px;background:rgba(255,255,255,.08);color:rgba(255,255,255,.55);border:2px solid transparent}
.step.on{background:var(--amber);color:var(--ink)}
.counter{font-weight:700;font-size:30px;color:var(--mint);display:flex;align-items:center;gap:12px}
.vhs{position:absolute;inset:0;pointer-events:none;z-index:15;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 2px,transparent 2px 5px);}
.vhsband{position:absolute;left:0;right:0;height:60px;background:rgba(255,255,255,.12);filter:blur(6px)}
.vhstag{position:absolute;top:130px;right:70px;font-family:'DejaVu Sans Mono',monospace;font-weight:700;font-size:44px;color:#fff;text-shadow:0 0 12px rgba(255,255,255,.6);direction:rtl}
.vhstag .ar{font-family:Cairo}
.tc{position:absolute;bottom:60px;left:70px;font-family:'DejaVu Sans Mono',monospace;font-size:36px;color:#fff;text-shadow:0 0 10px #fff8}
.caption{position:absolute;left:0;right:0;bottom:70px;display:flex;justify-content:center}
.captxt{white-space:nowrap;background:rgba(0,0,0,.78);padding:16px 44px;border-radius:14px;font-size:40px;font-weight:700}
.dim{position:absolute;inset:0;background:rgba(6,23,30,.8);z-index:25}
.opt{position:absolute;top:350px;width:520px;height:350px;padding:30px 34px;border-radius:30px;background:#fff;color:var(--ink);font-size:31px;font-weight:700;line-height:1.5;z-index:26;border:6px solid transparent}
.opt .let{width:66px;height:66px;border-radius:50%;background:var(--ink2);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:36px;margin-bottom:14px}
.opt .mark{position:absolute;left:24px;top:24px;width:66px;height:66px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:900;color:#fff}
.fb{position:absolute;left:0;right:0;top:740px;text-align:center;z-index:27}
.fbin{display:inline-block;padding:22px 60px;border-radius:24px;background:var(--green);color:#fff;font-weight:900;font-size:50px;box-shadow:0 16px 40px rgba(0,0,0,.35)}
.fbsub{font-size:36px;font-weight:700;margin-top:14px;color:var(--mint)}
.page{position:absolute;left:560px;top:150px;width:800px;height:600px;background:var(--paper);color:var(--ink);border-radius:18px;padding:60px 70px;box-shadow:0 30px 80px rgba(0,0,0,.45);
  background-image:repeating-linear-gradient(180deg,transparent 0 63px,rgba(18,115,105,.18) 63px 65px);z-index:30}
.page:before{content:"";position:absolute;right:46px;top:0;bottom:0;width:3px;background:rgba(226,88,76,.45)}
.page .num{font-weight:900;font-size:30px;color:var(--teal)}
.page .lt{font-weight:900;font-size:52px;line-height:1.3;margin:6px 0 24px}
.page .law{font-weight:700;font-size:40px;line-height:1.6}
.slots{position:absolute;left:0;right:0;top:860px;height:140px;z-index:29}
.slot{position:absolute;top:0;width:220px;height:130px;border-radius:16px;border:3px dashed rgba(191,233,223,.55);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:24px;color:rgba(191,233,223,.8);text-align:center;line-height:1.3}
.slot.full{border:3px solid var(--teal2);background:var(--teal);color:#fff}
.slot .ic{font-size:34px;font-weight:900}
</style>
</head>
<body>
<div id="stage"></div>
<script>
'use strict';
/* =====================  helpers  ===================== */
const W=1920,H=1080;
const ar=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const ease=p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;
const easeOut=p=>1-Math.pow(1-p,3);
const back=p=>{const c=1.7;return 1+(c+1)*Math.pow(p-1,3)+c*Math.pow(p-1,2)};
const lin=p=>p;
function V(t,kf){ // kf: [[t,v,easeFn?],...]
  if(t<=kf[0][0])return kf[0][1];
  const L=kf[kf.length-1]; if(t>=L[0])return L[1];
  for(let i=0;i<kf.length-1;i++){const a=kf[i],b=kf[i+1];
    if(t>=a[0]&&t<b[0]){const p=(t-a[0])/(b[0]-a[0]);return a[1]+(b[1]-a[1])*(b[2]||ease)(p)}}
  return L[1];
}
function K(el,t,kf){ if(!el)return; const keys=new Set();kf.forEach(k=>Object.keys(k[1]).forEach(x=>keys.add(x)));
  const pr={}; for(const key of keys){const fr=kf.filter(k=>key in k[1]).map(k=>[k[0],k[1][key],k[2]]);pr[key]=V(t,fr)} S(el,pr)}
function S(el,p){ if(!el)return;
  if('o'in p)el.style.opacity=clamp(p.o,0,1);
  if('x'in p||'y'in p||'s'in p||'r'in p)el.style.transform=`translate(${p.x||0}px,${p.y||0}px) rotate(${p.r||0}deg) scale(${p.s==null?1:p.s})`;
  if('b'in p)el.style.filter=p.b>0.01?`blur(${p.b}px)`:'none';
  if('cl'in p)el.style.clipPath=`inset(-20px -20px -20px ${100-clamp(p.cl,0,100)}%)`;
  if('dash'in p)el.style.strokeDashoffset=p.dash;
}
const pop=(t0,dur=.5)=>[[t0,{o:0,s:.6}],[t0+dur,{o:1,s:1},back]];
const fadeUp=(t0,d=.6,dy=40)=>[[t0,{o:0,y:dy}],[t0+d,{o:1,y:0},easeOut]];
function wordify(el){if(el._w)return el._w;const txt=el.textContent.trim();el.innerHTML=txt.split(/\s+/).map(w=>`<span>${w}</span>`).join(' ');el._w=[...el.children];return el._w}
function revealWords(el,t,t0,t1){const ws=wordify(el),n=ws.length;ws.forEach((w,i)=>{const a=t0+(t1-t0)*i/n;w.style.opacity=clamp((t-a)/.22,0,1)})}
const html=s=>{const d=document.createElement('div');d.innerHTML=s.trim();return d.firstElementChild};

/* =====================  SVG art  ===================== */
function person(o={}){
  const skin=o.skin||'#f2c7a5', scarf=o.scarf||'#7d5ba6', coat=o.coat!==false, top=o.top||'#4f7bd0', pants=o.pants||'#3b4a63';
  const sleeve=coat?'#ffffff':top, body=coat?'#ffffff':top;
  const shoes=o.open
   ? `<ellipse cx="-24" cy="-6" rx="22" ry="8" fill="${skin}"/><ellipse cx="22" cy="-6" rx="22" ry="8" fill="${skin}"/>
      <path d="M-40,-8h34M4,-8h34" stroke="#c0574a" stroke-width="5"/><path d="M-44,0h44M0,0h44" stroke="#7a3b2f" stroke-width="5"/>`
   : `<rect x="-46" y="-18" width="44" height="20" rx="10" fill="#2a2f3a"/><rect x="2" y="-18" width="44" height="20" rx="10" fill="#2a2f3a"/>`;
  const goggles=o.goggles?`<rect x="-38" y="-404" width="76" height="24" rx="11" fill="rgba(140,220,255,.55)" stroke="#2f6f96" stroke-width="4"/>`:'';
  const glasses=o.glasses?`<circle cx="-15" cy="-392" r="12" fill="none" stroke="#333" stroke-width="3.5"/><circle cx="15" cy="-392" r="12" fill="none" stroke="#333" stroke-width="3.5"/><path d="M-3,-392h6" stroke="#333" stroke-width="3"/>`:'';
  const coatDetail=coat?`<path d="M0,-326 L-26,-270 M0,-326 L26,-270" stroke="#cfd8dc" stroke-width="5" fill="none"/><path d="M0,-300V-160" stroke="#cfd8dc" stroke-width="3"/><rect x="34" y="-230" width="34" height="26" rx="5" fill="none" stroke="#cfd8dc" stroke-width="3"/>`:'';
  const armR=o.armR||0, armL=o.armL||0;
  return `<g class="person">
  <ellipse cx="0" cy="2" rx="80" ry="13" fill="rgba(0,0,0,.18)"/>
  <rect x="-36" y="-172" width="30" height="164" rx="12" fill="${pants}"/><rect x="6" y="-172" width="30" height="164" rx="12" fill="${pants}"/>
  ${shoes}
  <g transform="rotate(${armL} -88 -318)"><rect x="-108" y="-322" width="30" height="156" rx="15" fill="${sleeve}" stroke="${coat?'#d5dde0':'none'}" stroke-width="3"/><circle cx="-93" cy="-162" r="17" fill="${skin}"/></g>
  <path d="M-72,-334 Q-86,-332 -90,-300 L-100,-140 L100,-140 L90,-300 Q86,-332 72,-334 Z" fill="${body}" stroke="${coat?'#d5dde0':'none'}" stroke-width="3"/>
  ${coatDetail}
  <g class="armR" transform="rotate(${armR} 88 -318)"><rect x="78" y="-322" width="30" height="156" rx="15" fill="${sleeve}" stroke="${coat?'#d5dde0':'none'}" stroke-width="3"/><circle cx="93" cy="-162" r="17" fill="${skin}"/>${o.hand||''}</g>
  <path d="M-64,-392 A64,64 0 0 1 64,-392 L74,-326 Q0,-296 -74,-326 Z" fill="${scarf}"/>
  <ellipse cx="0" cy="-386" rx="40" ry="46" fill="${skin}"/>
  <path d="M-42,-400 Q0,-446 42,-400 Q30,-430 0,-434 Q-30,-430 -42,-400Z" fill="${scarf}"/>
  <circle cx="-15" cy="-390" r="4.5" fill="#2b2b2b"/><circle cx="15" cy="-390" r="4.5" fill="#2b2b2b"/>
  <circle cx="-25" cy="-372" r="7" fill="rgba(230,120,120,.25)"/><circle cx="25" cy="-372" r="7" fill="rgba(230,120,120,.25)"/>
  <path d="${o.sad?'M-11,-362 Q0,-370 11,-362':'M-12,-367 Q0,-357 12,-367'}" stroke="#7a3b2f" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  ${goggles}${glasses}
  </g>`;
}
const SALMA={scarf:'#c2577f',skin:'#f0c4a0',top:'#5b7fd6',pants:'#3a4560'};
const MATE={scarf:'#3f8f7b',skin:'#d9a982',pants:'#4a3f5c'};
const SUP={scarf:'#127369',skin:'#e9bd98',glasses:true,pants:'#33414f'};
function flask(x,y,c,k=1){return `<g transform="translate(${x},${y}) scale(${k})"><path d="M-10,-70h20v26l26,44q6,12-8,12h-56q-14,0-8-12l26-44z" fill="rgba(255,255,255,.65)" stroke="#7aa" stroke-width="3"/><path d="M-30,-6 l14,-24h32l14,24q4,6-6,6h-48q-10,0-6-6z" fill="${c}"/></g>`}
function tube(x,y,c){return `<g transform="translate(${x},${y})"><rect x="-9" y="-60" width="18" height="60" rx="9" fill="rgba(255,255,255,.7)" stroke="#7aa" stroke-width="3"/><rect x="-6" y="-26" width="12" height="23" rx="6" fill="${c}"/></g>`}
let BDN=0, CUR_U='g0';
function backdrop(o={}){
  const u='g'+(++BDN); CUR_U=u;
  return `<defs>
  <linearGradient id="wall${u}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e8f3ef"/><stop offset="1" stop-color="#d2e6df"/></linearGradient>
  <linearGradient id="floor${u}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b8cbc7"/><stop offset="1" stop-color="#93aaa6"/></linearGradient>
  <linearGradient id="counter${u}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b4b55"/><stop offset="1" stop-color="#2b3740"/></linearGradient>
  <linearGradient id="cab${u}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f7fbfa"/><stop offset="1" stop-color="#dce8e5"/></linearGradient>
  </defs>
  <rect width="1920" height="760" fill="url(#wall${CUR_U})"/>
  <g stroke="rgba(18,115,105,.07)" stroke-width="2">${Array.from({length:24},(_,i)=>`<path d="M${i*84},0V740"/>`).join('')}${Array.from({length:9},(_,i)=>`<path d="M0,${i*84}H1920"/>`).join('')}</g>
  <rect y="736" width="1920" height="344" fill="url(#floor${CUR_U})"/>
  <g stroke="rgba(255,255,255,.25)" stroke-width="2">${Array.from({length:13},(_,i)=>`<path d="M${960+(i-6)*170},740 L${960+(i-6)*420},1080"/>`).join('')}<path d="M0,820H1920M0,930H1920"/></g>
  <rect y="726" width="1920" height="16" fill="#8aa7a1"/>
  ${o.window!==false?`<g><rect x="110" y="110" width="330" height="250" rx="10" fill="#b9e2f2" stroke="#fff" stroke-width="14"/><path d="M275,110V360M110,235H440" stroke="#fff" stroke-width="10"/><path d="M140,330 L220,250 L260,290 L330,210 L420,300" stroke="rgba(255,255,255,.6)" stroke-width="6" fill="none"/></g>`:''}
  ${o.shelf!==false?`<g><rect x="1390" y="250" width="440" height="16" rx="4" fill="#9fb6b1"/>${flask(1450,250,'#5fc3a8')}${flask(1540,250,'#f4ab3c',.8)}${tube(1620,250,'#e2584c')}${tube(1650,250,'#7d5ba6')}${flask(1740,250,'#6aa6e8',.9)}</g>`:''}`;
}
function counter(x,y,w,o={}){ // lab bench front at y (top)
  return `<g><rect x="${x}" y="${y}" width="${w}" height="26" rx="6" fill="url(#counter${CUR_U})"/><rect x="${x+14}" y="${y+26}" width="${w-28}" height="${740-y-26}" fill="url(#cab${CUR_U})" stroke="#c6d6d2" stroke-width="3"/>
  ${Array.from({length:Math.floor((w-28)/180)},(_,i)=>`<rect x="${x+24+i*180}" y="${y+46}" width="160" height="${740-y-70}" rx="8" fill="none" stroke="#c6d6d2" stroke-width="3"/><rect x="${x+90+i*180}" y="${y+66}" width="28" height="8" rx="4" fill="#9fb6b1"/>`).join('')}</g>`;
}
function sink(x,y){return `<g><rect x="${x}" y="${y-6}" width="230" height="22" rx="8" fill="#a9bcc3"/><rect x="${x+20}" y="${y}" width="190" height="14" rx="6" fill="#6f848c"/><path d="M${x+115},${y-6} v-70 q0,-26 -26,-26 h-30" stroke="#9aaeb5" stroke-width="16" fill="none" stroke-linecap="round"/><rect x="${x+150}" y="${y-30}" width="16" height="26" rx="5" fill="#9aaeb5"/></g>`}
function hazard(x,y,k=1){return `<g transform="translate(${x},${y}) scale(${k})"><rect x="-50" y="-50" width="100" height="100" transform="rotate(45)" fill="#fff" stroke="#d6312a" stroke-width="10"/><path d="M-26,-14 l10,-12 l10,12 M8,-14 l10,-12 l10,12" stroke="#222" stroke-width="5" fill="none"/><path d="M-22,-4 q-4,10 2,14 M18,-4 q-4,10 2,14" stroke="#222" stroke-width="4" fill="none"/><rect x="-34" y="20" width="68" height="8" fill="#222"/></g>`}
function notebookIcon(x,y,k=1){return `<g transform="translate(${x},${y}) scale(${k})"><path d="M0,-90 Q-80,-120 -170,-96 V96 Q-80,72 0,100 Q80,72 170,96 V-96 Q80,-120 0,-90Z" fill="#fbf6ea" stroke="#127369" stroke-width="8"/><path d="M0,-90V100" stroke="#127369" stroke-width="6"/>${[0,1,2,3].map(i=>`<path d="M-140,${-50+i*36} Q-75,${-66+i*36} -24,${-50+i*36} M24,${-50+i*36} Q75,${-66+i*36} 140,${-50+i*36}" stroke="rgba(18,115,105,.35)" stroke-width="6" fill="none"/>`).join('')}</g>`}
const ICON={
 lens:`<svg viewBox="0 0 100 100" width="100%" height="100%"><circle cx="42" cy="42" r="28" fill="rgba(191,233,223,.35)" stroke="currentColor" stroke-width="9"/><path d="M63,63 L88,88" stroke="currentColor" stroke-width="13" stroke-linecap="round"/></svg>`,
 rew:`<svg viewBox="0 0 100 100" width="100%" height="100%"><path d="M48,22 L10,50 L48,78Z M90,22 L52,50 L90,78Z" fill="currentColor"/></svg>`,
 dec:`<svg viewBox="0 0 100 100" width="100%" height="100%"><circle cx="50" cy="50" r="40" fill="none" stroke="currentColor" stroke-width="9"/><path d="M30,52 L45,66 L72,36" stroke="currentColor" stroke-width="11" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
};
const CURSOR=`<svg class="cursor" viewBox="0 0 60 60"><path d="M8,4 L8,48 L20,37 L28,56 L36,52 L28,34 L44,34 Z" fill="#fff" stroke="#0a2530" stroke-width="3.5" stroke-linejoin="round"/></svg>`;
const MAG=`<svg viewBox="0 0 200 200" width="200" height="200" style="overflow:visible"><circle cx="90" cy="90" r="64" fill="rgba(191,233,223,.18)" stroke="#f4ab3c" stroke-width="14"/><circle cx="90" cy="90" r="64" fill="none" stroke="#fff" stroke-width="3" opacity=".7"/><path d="M137,137 L186,186" stroke="#0a2530" stroke-width="26" stroke-linecap="round"/><path d="M137,137 L186,186" stroke="#f4ab3c" stroke-width="16" stroke-linecap="round"/></svg>`;

/* =====================  timeline & cues  ===================== */
const SCENES=[]; const CUES=[];
let clock=0;
function addScene(dur,build,update,cues=[]){const el=document.createElement('div');el.className='scene';document.getElementById('stage').appendChild(el);
  const sc={start:clock,dur,el};build(el,sc);sc.update=update;SCENES.push(sc);cues.forEach(c=>CUES.push({t:+(clock+c[0]).toFixed(3),type:c[1]}));clock+=dur;return sc}
const q=(el,s)=>el.querySelector(s), qa=(el,s)=>[...el.querySelectorAll(s)];
function sceneFade(sc,t){K(sc.el,t,[[0,{o:0}],[.45,{o:1}],[sc.dur-.45,{o:1}],[sc.dur,{o:0}]])}
function cursorTo(el,t,path){ // path: [[t,x,y],...], clicks:[t]
  const x=V(t,path.map(p=>[p[0],p[1]])),y=V(t,path.map(p=>[p[0],p[2]]));
  let s=1; (el._clicks||[]).forEach(c=>{if(t>c&&t<c+.25)s=1-.25*Math.sin((t-c)/.25*Math.PI)});
  S(el,{x,y,s,o:V(t,[[path[0][0]-.3,0],[path[0][0],1]])});
}

/* ---------- 1. INTRO ---------- */
addScene(8.5,el=>{
  el.innerHTML=`
  <svg class="abs" width="1920" height="1080" viewBox="0 0 1920 1080">
